name: Probe CFBD SP+ (names only)
on:
  push:
    branches: [probe/cfbd-sp]
    paths-ignore: [tools/probe-out/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          YEAR: "2026"
        run: |
          mkdir -p tools/probe-out
          python3 tools/cfbd_sp_probe.py > tools/probe-out/cfbd-sp.txt 2>&1 || true
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add tools/probe-out && git commit -m "probe output" && git push
