# Fetches team data the browser cannot fetch itself - Kalshi markets, beat-writer
# RSS, the official depth chart and availability report - and commits it into
# this repo. GitHub Pages then serves it same-origin, so CORS never enters.
#
# This runs from a GitHub-hosted runner, which is a different IP range than
# Cloudflare's shared edge — the one that Kalshi rate-limits into the ground.
#
# Each source is independent: every producer step has continue-on-error, and
# the commit step adds only what a step that SUCCEEDED produced - team by
# team where a step reads many teams. A broken source is reported once, as an
# issue, by the Source health step (tools/producers/health.py). A failing
# school website can never again cost the odds (it did on 2026-09-23, run 100).
#
# Cadence (decision 0020): odds, beat news, conference availability and a
# media index's game notes every run; the official depth chart every run in a
# game window or the team's publish window, otherwise every 2 hours
# (tools/producers/cadence.py).
# GitHub's scheduler is best-effort: "twice an hour" has in practice meant a
# run every 2-5 hours.
name: Refresh team data
# Who started the run, in its title: "(clock)", "(hand)" or "(schedule)". The
# Actions list then shows at a glance whether the external clock is firing,
# and the freshness monitor finds the clock's last run by this title.
run-name: "Refresh team data (${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }})"

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, off the hour to dodge the crowd
  # A Run workflow button in the Actions tab, and the door the external clock
  # uses (docs/engineering/data-refresh-clock.md): GitHub's own scheduler
  # runs this every 2-5 hours, not every 30 minutes. The clock sends
  # source=clock so its runs follow the depth-chart cadence like scheduled
  # ones; a run by hand always checks everything.
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run"
        default: "hand"
        type: string

permissions:
  contents: write
  issues: write        # the freshness monitor reports a missed update as an issue
  actions: read        # and reads the previous run's start to spot a stalled clock

concurrency:
  group: team-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The league's Kalshi markets for the season they belong to (W16):
      # this season's while any is open, next season's once Kalshi lists it,
      # neither until then - never last season's. The events are the league's
      # rule (LEAGUE_MARKETS in leagues/college-football.js), not this file's.
      # Kalshi unreachable leaves the last files as they were.
      - name: Fetch from Kalshi
        id: kalshi
        continue-on-error: true
        run: python3 tools/producers/markets.py

      - name: Refuse to commit anything that is not market data
        id: odds
        if: steps.kalshi.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, sys
          for f in ("data/league/odds-title.json", "data/league/odds-playoff.json"):
              try:
                  d = json.load(open(f))
              except Exception as e:
                  sys.exit(f"{f} is not valid JSON: {e}")
              if "markets" not in d:
                  sys.exit(f"{f} has no markets key — refusing to commit")
              print(f, "->", len(d["markets"]), "markets")
          PY

      # ESPN's Football Power Index for every FBS team (W07). ESPN publishes a
      # new edition daily at 08:00Z, 4 AM ET (observed Sep 30, Oct 1 and Oct 2:
      # docs/engineering/rankings-sources.md), so most runs find the same
      # table and write nothing. A table that fails validation is refused and
      # the last good snapshot stays. The season is the one being played:
      # January to June is last season's, as the page counts it.
      - name: Fetch ESPN's FPI
        id: fpi
        continue-on-error: true      # a refused table must never block the odds
        run: |
          Y=$(date -u +%Y); M=$(date -u +%-m)
          [ "$M" -lt 7 ] && Y=$((Y - 1))
          python3 tools/producers/fpi.py --season "$Y"

      # Every week's AP, Coaches and CFP top 25, and FPI as it stood each
      # week, kept for Top 25's week selector (David, 2026-10-20). ESPN's
      # rankings feed answers only the current week; its core API keeps them
      # all. The first run fills the season; later ones read only the newest
      # weeks, and a broken week never replaces a kept one.
      - name: Keep this season's rankings, week by week
        id: rankhistory
        continue-on-error: true      # a refused week must never block the odds
        run: |
          Y=$(date -u +%Y); M=$(date -u +%-m)
          [ "$M" -lt 7 ] && Y=$((Y - 1))
          python3 tools/producers/rankings_history.py --season "$Y"

      # Every team that declares an odds history (backlog C2): its price, read
      # from the league-wide markets by its own Kalshi declaration.
      - name: Append each team's price to its season history
        id: oddshistory
        if: steps.odds.outcome == 'success'
        continue-on-error: true
        run: |
          fail=0
          for t in $(python3 tools/producers/teamconfig.py --with oddsHistory); do
            echo "== $t"; python3 tools/producers/odds_history.py --team "$t" || fail=1
          done
          exit $fail

      # The last successful check lives in the Actions cache, not the repo, so
      # recording it never makes a commit. One file per team.
      - name: Recall the last depth chart checks
        uses: actions/cache/restore@v4
        with:
          path: .cadence
          key: depth-checked-${{ github.run_id }}
          restore-keys: depth-checked-

      # Each team's feeds are its declaration (TEAM_CONFIG.sources.beatFeeds).
      # A feed that has moved is found on its site and named in a warning.
      # Every team on every run (David, 2026-11-02: fans should have the
      # news early). Phase 0 (2026-10-27) had put news on the depth chart's
      # two-hour cadence to keep a run short at 138 teams; eight teams at a
      # time keep it short instead (39 teams one by one took 82 s). Each
      # team's log is printed whole, in order, after they all finish.
      - name: Pull beat writers
        id: news
        continue-on-error: true      # a dead feed must never block the odds
        run: |
          H="$RUNNER_TEMP/health"; logs="$RUNNER_TEMP/news"; mkdir -p "$H" "$logs"; rm -f "$logs/ok" "$logs/failed"
          teams=$(python3 tools/producers/teamconfig.py --with beatNews)
          printf '%s\n' $teams | xargs -P 8 -I{} sh -c \
            'if python3 tools/producers/beat_news.py --team "$1" > "$2/$1.log" 2>&1; then echo "$1" >> "$2/ok"; else echo "$1" >> "$2/failed"; fi' _ {} "$logs"
          for t in $teams; do echo "== $t"; cat "$logs/$t.log"; done
          # Each team on its own (David, 2026-11-05): a team whose feeds failed
          # keeps its last news; every other team's is saved this run.
          paths=""
          for t in $(cat "$logs/ok" 2>/dev/null); do printf 'news\t%s\n' "$t" >> "$H/ok.tsv"; paths="$paths data/$t/news.json"; done
          for t in $(cat "$logs/failed" 2>/dev/null); do printf 'news\t%s\t%s\n' "$t" "$logs/$t.log" >> "$H/failed.tsv"; done
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      # Per team: due by hand, or by the depth-chart cadence (decision 0020).
      - name: Official depth chart and availability
        id: depth
        continue-on-error: true
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'clock' }}
        run: |
          pip install --quiet beautifulsoup4 pypdf
          H="$RUNNER_TEMP/health"; mkdir -p "$H"; teams=""
          for t in $(python3 tools/producers/teamconfig.py --with depth); do
            echo "== $t"
            mkdir -p .cadence
            # the check from before per-team files counts as this team's, once
            if [ -f .cadence/depth-checked ] && [ ! -f ".cadence/$t" ]; then cp .cadence/depth-checked ".cadence/$t"; fi
            if [ "$BY_HAND" = true ]; then echo "  depth chart due: run by hand"
            else
              rc=0; python3 tools/producers/cadence.py --team "$t" --last ".cadence/$t" --cache "$RUNNER_TEMP/kickoffs" --official --exit-code > "$H/depth-$t.log" 2>&1 || rc=$?
              cat "$H/depth-$t.log"
              if [ $rc -eq 3 ]; then continue; fi          # not due
              if [ $rc -ne 0 ]; then printf 'depth\t%s\t%s\n' "$t" "$H/depth-$t.log" >> "$H/failed.tsv"; continue; fi
            fi
            if python3 tools/producers/official_depth.py --team "$t" --season 2026 > "$H/depth-$t.log" 2>&1; then
              cat "$H/depth-$t.log"
              date -u +%Y-%m-%dT%H:%M:%SZ > ".cadence/$t"
              printf 'depth\t%s\n' "$t" >> "$H/ok.tsv"; teams="$teams $t"
            else
              cat "$H/depth-$t.log"
              printf 'depth\t%s\t%s\n' "$t" "$H/depth-$t.log" >> "$H/failed.tsv"
            fi
          done
          echo "teams=$teams" >> "$GITHUB_OUTPUT"

      # A conference's availability reports, for each team that declares the
      # feed (sources.official.availabilityFeed) - Ohio State's are the Big
      # Ten's. Two small JSON calls a run, so on every run: no cadence needed.
      # One conference is asked once a run, whatever number of its teams
      # read it (--cache).
      - name: Conference availability reports
        id: confav
        continue-on-error: true
        run: |
          H="$RUNNER_TEMP/health"; mkdir -p "$H"; paths=""
          for t in $(python3 tools/producers/teamconfig.py --with availability); do
            if ! grep -q "availabilityFeed" "teams/$t.js"; then continue; fi
            echo "== $t"
            if python3 tools/producers/conference_availability.py --team "$t" --cache "$RUNNER_TEMP/confav" > "$H/confav-$t.log" 2>&1; then
              cat "$H/confav-$t.log"
              paths="$paths data/$t/availability.json data/$t/availability-history.json"
              printf 'confav\t%s\n' "$t" >> "$H/ok.tsv"
            else
              cat "$H/confav-$t.log"
              printf 'confav\t%s\t%s\n' "$t" "$H/confav-$t.log" >> "$H/failed.tsv"
            fi
          done
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      # A team's game notes from its official media index, for a team whose
      # depth-chart index does not carry them (Ohio State's Media Center;
      # David, 2026-10-26). The index is one page, looked at every run (David,
      # 2026-11-02: it was every three hours); the notes PDF is read only when
      # a new week's is posted (or the reading changed):
      # tools/producers/official_notes.py.
      - name: Official game notes from a media index
        id: notes
        continue-on-error: true
        run: |
          pip install --quiet beautifulsoup4 pypdf
          H="$RUNNER_TEMP/health"; mkdir -p "$H"; paths=""
          for t in $(python3 tools/producers/teamconfig.py --with notes); do
            grep -q "notesIndex" "teams/$t.js" || continue
            echo "== $t"
            if python3 tools/producers/official_notes.py --team "$t" > "$H/notes-$t.log" 2>&1; then
              cat "$H/notes-$t.log"
              paths="$paths data/$t/notes.json"; printf 'notes\t%s\n' "$t" >> "$H/ok.tsv"
            else
              cat "$H/notes-$t.log"
              printf 'notes\t%s\t%s\n' "$t" "$H/notes-$t.log" >> "$H/failed.tsv"
            fi
          done
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      # The defending national champion, from ESPN's postseason scoreboard
      # (David, 2026-10-27: Home's banner for whoever won the last title
      # game). It changes once a year, in January, so every six hours is
      # plenty - or whenever a run is started by hand.
      - name: The defending national champion
        id: champion
        continue-on-error: true
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'clock' }}
        run: |
          mkdir -p .cadence
          stamp=".cadence/champion"
          if [ "$BY_HAND" != true ] && [ -f "$stamp" ] && [ $(( $(date +%s) - $(date -d "$(cat "$stamp")" +%s) )) -lt 21600 ]; then
            echo "looked under six hours ago"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 tools/producers/champion.py
          date -u +%Y-%m-%dT%H:%M:%SZ > "$stamp"
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # Each team's recruiting class and the NFL draft board, from ESPN (W16:
      # the after-season Home's recruiting and draft cards). Once a day - a
      # class and a board move over days, and each read fetches every record -
      # or whenever a run is started by hand. The last refresh's time lives
      # in the same Actions cache as the depth chart's, never in the repo.
      - name: Recruiting classes and the draft board
        id: prospects
        continue-on-error: true      # a refused class must never block the odds
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'clock' }}
        run: |
          mkdir -p .cadence
          if [ "$BY_HAND" != true ]; then
            rc=0; python3 tools/producers/prospects.py due --last .cadence/prospects || rc=$?
            if [ $rc -eq 3 ]; then echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          fail=0
          for t in $(python3 tools/producers/teamconfig.py --with recruits); do
            echo "== $t"; python3 tools/producers/prospects.py recruits --team "$t" || fail=1
          done
          echo "== the draft board"; python3 tools/producers/prospects.py draft --out data/league/draft.json || fail=1
          # The day counts as done only when everything came back.
          [ $fail -eq 0 ] && date -u +%Y-%m-%dT%H:%M:%SZ > .cadence/prospects
          echo "ran=true" >> "$GITHUB_OUTPUT"
          exit $fail

      # Every FBS team's turnovers, yards allowed and the two FBS ranks ESPN
      # gets wrong, added up from ESPN's own box scores (David, 2026-11-10:
      # CollegeFootballData only where nothing else will do). Once a day:
      # they move only when a team plays. A snapshot that fails validation
      # is refused and the last good one stays.
      - name: Season figures from ESPN's box scores
        id: seasonstats
        continue-on-error: true      # a refused snapshot must never block the odds
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'clock' }}
        run: |
          mkdir -p .cadence
          if [ "$BY_HAND" != true ]; then
            rc=0; python3 tools/producers/season_stats.py due --last .cadence/season-stats || rc=$?
            if [ $rc -eq 3 ]; then echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          Y=$(date -u +%Y); M=$(date -u +%-m)
          [ "$M" -lt 7 ] && Y=$((Y - 1))
          python3 tools/producers/season_stats.py --season "$Y"
          date -u +%Y-%m-%dT%H:%M:%SZ > .cadence/season-stats
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # Which sources failed, for which teams, and why - told once
      # (tools/producers/health.py; David, 2026-11-05: the "Run failed"
      # emails were constant and said nothing). One issue per source once a
      # failure has lasted three runs in a row; it updates in place and
      # closes when every team has recovered. The run itself stays green.
      - name: Source health
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A step that skipped itself as not due (champion, recruiting: ran=false)
        # reports "skipped", never "success": not trying is not recovering
        # (Codex, #225).
        run: |
          mkdir -p .cadence
          python3 tools/producers/health.py --dir "$RUNNER_TEMP/health" --state .cadence/health.json --open-issues \
            --steps "kalshi=${{ steps.kalshi.outcome }},odds=${{ steps.odds.outcome }},oddshistory=${{ steps.oddshistory.outcome }},news=${{ steps.news.outcome }},depth=${{ steps.depth.outcome }},confav=${{ steps.confav.outcome }},notes=${{ steps.notes.outcome }},fpi=${{ steps.fpi.outcome }},rankhistory=${{ steps.rankhistory.outcome }},prospects=${{ steps.prospects.outcome == 'failure' && 'failure' || (steps.prospects.outputs.ran == 'true' && 'success' || 'skipped') }},champion=${{ steps.champion.outcome == 'failure' && 'failure' || (steps.champion.outputs.ran == 'true' && 'success' || 'skipped') }},seasonstats=${{ steps.seasonstats.outcome == 'failure' && 'failure' || (steps.seasonstats.outputs.ran == 'true' && 'success' || 'skipped') }}"

      - name: Remember the depth chart checks
        if: always() && hashFiles('.cadence/*') != ''
        uses: actions/cache/save@v4
        with:
          path: .cadence
          key: depth-checked-${{ github.run_id }}

      # Add only what a step that succeeded produced, and say in the message
      # which data moved. Team files are in data/<team id>/, league-wide ones
      # in data/league/.
      - name: Commit what moved
        env:
          ODDS: ${{ steps.odds.outcome }}
          HISTORY: ${{ steps.oddshistory.outcome }}
          NEWS_PATHS: ${{ steps.news.outputs.paths }}
          DEPTH_TEAMS: ${{ steps.depth.outputs.teams }}
          CONFAV_PATHS: ${{ steps.confav.outputs.paths }}
          FPI: ${{ steps.fpi.outcome }}
          RANKS: ${{ steps.rankhistory.outcome }}
          PROSPECTS: ${{ steps.prospects.outputs.ran }}
          NOTES_PATHS: ${{ steps.notes.outputs.paths }}
          CHAMPION: ${{ steps.champion.outputs.ran }}
          SEASONSTATS: ${{ steps.seasonstats.outputs.ran }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          moved=""
          add () {   # add <label> <pathspec...>
            label=$1; shift
            git add -A -- "$@" 2>/dev/null || true
            if ! git diff --staged --quiet -- "$@"; then
              case ", $moved, " in *", $label, "*) ;; *) moved="${moved:+$moved, }$label" ;; esac
            fi
          }
          [ "$ODDS" = success ]    && add "odds" 'data/league/odds-*.json'
          [ "$HISTORY" = success ] && add "odds history" 'data/*/odds-history.json'
          # Team by team (David, 2026-11-05): only the teams whose step read them.
          [ -n "$NEWS_PATHS" ]     && add "news" $NEWS_PATHS
          for t in $DEPTH_TEAMS; do
            add "depth chart" "data/$t/depth.json" "data/$t/depth-history.json"
            add "availability" "data/$t/availability.json" "data/$t/availability-history.json"
            add "game notes" "data/$t/notes.json"
          done
          # a media index's notes: only the teams whose notes were read
          [ -n "$NOTES_PATHS" ]    && add "game notes" $NOTES_PATHS
          # only the files of the teams whose conference report was read
          [ -n "$CONFAV_PATHS" ]   && add "conference availability" $CONFAV_PATHS
          [ "$FPI" = success ]     && add "FPI" 'data/league/fpi.json'
          [ "$RANKS" = success ]   && add "rankings by week" 'data/league/rankings-*.json' 'data/league/fpi-history-*.json'
          # Each file is written only when it passed; a refused one is left as it was.
          [ "$PROSPECTS" = true ]  && add "recruiting" 'data/*/recruits.json'
          [ "$PROSPECTS" = true ]  && add "draft board" 'data/league/draft.json'
          [ "$CHAMPION" = true ]   && add "national champion" 'data/league/champion.json'
          [ "$SEASONSTATS" = true ] && add "season figures" 'data/league/season-stats.json'
          if [ -z "$moved" ]; then echo "nothing moved"; exit 0; fi
          git commit -q -m "Refresh team data: $moved"
          echo "committed: $moved"
          git push || { git pull --rebase -q origin main && git push; }

      # A monitor, not a gate: the data is already saved. A missed availability
      # update or a stalled clock is reported once, as an issue.
      - name: Check the data is as fresh as promised
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for t in $(python3 tools/producers/teamconfig.py --with availability); do
            python3 tools/producers/freshness.py --team "$t" --open-issues
          done

      # Notifications, Phase 0 (W19, David approved 2026-10-01): on Saturdays
      # ask the edge API whether ESPN's live scoreboard answers Cloudflare's
      # network, and how fast. It prints a status, a time and a game count -
      # no ESPN data - and never affects the refresh.
      - name: Probe ESPN from the edge API (Saturdays)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          [ "$(TZ=America/New_York date +%u)" = 6 ] || { echo "not a Saturday: no probe"; exit 0; }
          curl -sS --max-time 30 https://suite-api.dmvanblaircom.workers.dev/v1/probe/espn || echo "probe: the edge API did not answer"
          echo
