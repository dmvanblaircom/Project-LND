name: Probe CFP rankings history
on:
  push:
    branches: [probe/cfp-rankings]
    paths-ignore: [tools/probe-out/**, tools/fixtures/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          python3 tools/probe_cfp.py > tools/probe-out/cfp.txt 2>&1
          git add tools/probe-out tools/fixtures
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -m "Probe output" && git push
