name: Probe launchcheck (flaky on runners since Oct 16)
on:
  push:
    branches: [probe/launchcheck]
    paths-ignore: [tools/probe-out/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p tools/probe-out
          out=tools/probe-out/launchcheck.txt
          { echo "runner: $(lsb_release -ds 2>/dev/null) $(nproc) cpus"; npx playwright --version; } > $out
          for i in 1 2 3 4 5 6; do
            echo "== run $i" >> $out
            node tools/launchcheck.js > run.txt 2>&1; echo "exit $?" >> $out
            grep -E "FAIL|ms\)|Error" run.txt >> $out || true
          done
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add tools/probe-out && git commit -m "Probe output" && git push
