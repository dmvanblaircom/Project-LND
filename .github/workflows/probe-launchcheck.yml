name: Probe launchcheck (flaky on runners since Oct 16)
on:
  push:
    branches: [probe/launchcheck]
    paths-ignore: [tools/probe-out/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - shell: bash
        run: |
          set +e
          mkdir -p tools/probe-out
          out=tools/probe-out/launchcheck.txt
          echo "runner: $(lsb_release -ds 2>/dev/null) $(nproc) cpus; date $(date -u +%FT%TZ)" > $out
          # The visual job's steps before launchcheck, in order, as CI runs them.
          npm run test:visual > /dev/null 2>&1; echo "test:visual exit $?" >> $out
          for t in offseasonpreviewcheck rosterflowcheck ratingsflowcheck flickercheck homegamecheck mobilefitcheck statslayoutcheck focuscheck togglecheck; do
            node tools/$t.js > /dev/null 2>&1; echo "$t exit $?" >> $out
          done
          echo "== files the earlier checks changed:" >> $out; git status --porcelain | grep -v probe-out | head -20 >> $out
          echo "== processes still running:" >> $out; ps -eo pid,etimes,comm | grep -Ei "chrom|node|python|http" | grep -v grep | head -20 >> $out
          for i in 1 2 3 4; do
            echo "== launchcheck run $i" >> $out
            if LAUNCH_DEBUG=1 node tools/launchcheck.js > run.txt 2>&1; then echo "exit 0" >> $out; else echo "exit $?" >> $out; fi
            grep -E "FAIL" run.txt >> $out
            if grep -q FAIL run.txt; then echo "== full output of failing run $i" >> $out; cat run.txt >> $out; fi
            # the new-version scenario's timeline: events and the cover's opacity, ms clock
            awk '/a new version found on this open/{f=1} /the chooser/{f=0} f' run.txt | grep -E "LE\||SRV|LF\|[a-z0-9]+\|(1.00|0.97|0.00)" >> $out
          done
          git add tools/probe-out && git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -m "Probe output" && git push
