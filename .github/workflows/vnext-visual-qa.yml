name: Suite vNext visual QA
# Temporary branch-only browser acceptance harness for Suite vNext.

on:
  push:
    branches: ["design/suite-vnext-build"]
    paths: [".github/workflows/vnext-visual-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Serve Suite
        run: |
          python3 -m http.server 8000 > /tmp/suite-http.log 2>&1 &
          echo $! > /tmp/suite-http.pid
          sleep 2

      - name: Capture mobile reference screens
        run: |
          cat > visual-qa-runner.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "fs";

          const base = "http://127.0.0.1:8000/";
          const teams = ["notre-dame", "ohio-state"];
          const widths = [375, 430];
          const tabs = [
            ["home", "#tab-schedule", "#panel-schedule"],
            ["top25", "#tab-around", "#panel-around"],
            ["game", "#tab-game", "#panel-game"],
            ["depth", "#tab-depth", "#panel-depth"],
            ["news", "#tab-news", "#panel-news"]
          ];
          const active = {
            "notre-dame": { id:"87", name:"Notre Dame", full:"Notre Dame Fighting Irish", nick:"Fighting Irish", abbr:"ND", stadium:"Notre Dame Stadium" },
            "ohio-state": { id:"194", name:"Ohio State", full:"Ohio State Buckeyes", nick:"Buckeyes", abbr:"OSU", stadium:"Ohio Stadium" }
          };
          const report = [];
          fs.mkdirSync("visual-qa", { recursive: true });

          function raw(name){ return JSON.parse(fs.readFileSync("tools/fixtures/"+name+".json","utf8")); }
          function forTeam(value, team){
            if(team==="notre-dame") return structuredClone(value);
            let s=JSON.stringify(value);
            s=s.replaceAll("Notre Dame Fighting Irish","Ohio State Buckeyes");
            s=s.replaceAll("Fighting Irish","Buckeyes");
            s=s.replaceAll("Notre Dame Stadium","Ohio Stadium");
            s=s.replaceAll("Notre Dame","Ohio State");
            s=s.replaceAll('"87"','"194"');
            s=s.replaceAll('"ND"','"OSU"');
            return JSON.parse(s);
          }
          function schedule(team, mode){
            const d=forTeam(raw("espn-schedule"),team);
            if(mode==="pre") return d;
            const src=d.events.find(x=>x.id==="401858438") || d.events[0];
            const e=structuredClone(src);
            const comp=e.competitions[0];
            if(mode==="live"){
              e.date=new Date(Date.now()-90*60*1000).toISOString();
              comp.status={type:{state:"in",shortDetail:"3:23 - 2nd"}};
              const mine=comp.competitors.find(x=>String(x.id)===active[team].id);
              const other=comp.competitors.find(x=>String(x.id)!==active[team].id);
              if(mine){ mine.score={value:13,displayValue:"13"}; mine.winner=false; }
              if(other){ other.score={value:10,displayValue:"10"}; other.winner=false; }
            } else {
              e.date=new Date(Date.now()-2*60*60*1000).toISOString();
              comp.status={type:{state:"post",shortDetail:"Final"}};
            }
            return {events:[e]};
          }
          function summary(team, mode){
            const name=mode==="live"?"espn-summary-live":mode==="final"?"espn-summary-post":"espn-summary-pre";
            return forTeam(raw(name),team);
          }
          function rankings(team){ return forTeam(raw("espn-rankings"),team); }
          function scoreboard(team){ return forTeam(raw("espn-scoreboard"),team); }
          function teamStatus(team){ return forTeam(raw("espn-team"),team); }
          function roster(team){ return forTeam(raw("espn-roster"),team); }
          function news(team){ return forTeam(raw("espn-news"),team); }
          function seasonStats(team, key){
            const d=forTeam(raw("espn-season-stats"),team);
            return d.teams[String(key)] || d.teams[active[team].id] || Object.values(d.teams)[0];
          }

          async function routeESPN(page, team, mode){
            await page.route("**/*", async route => {
              const url=route.request().url();
              if(!/espn\.com/.test(url)) return route.continue();
              let body=null;
              if(/\/summary\?event=/.test(url)) body=summary(team,mode);
              else if(/\/rankings(?:\?|$)/.test(url)) body=rankings(team);
              else if(/\/scoreboard\?/.test(url)) body=scoreboard(team);
              else if(/\/news\?team=/.test(url)) body=news(team);
              else if(/\/roster(?:\?|$)/.test(url)) body=roster(team);
              else if(/\/statistics(?:\?|$)/.test(url)){
                const m=url.match(/\/teams\/(\d+)\/statistics/);
                body=seasonStats(team,m?m[1]:active[team].id);
              }
              else if(/\/schedule(?:\?|$)/.test(url)) body=schedule(team,mode);
              else {
                const m=url.match(/\/teams\/(\d+)(?:\?|$)/);
                if(m && m[1]===active[team].id) body=teamStatus(team);
              }
              if(body) return route.fulfill({status:200,contentType:"application/json",body:JSON.stringify(body)});
              return route.abort();
            });
          }

          async function measure(page, team, width, name, mode, panel, errors){
            const state=await page.evaluate(({name,panel})=>{
              const root=document.documentElement;
              const p=document.querySelector(panel);
              const rects=[...document.querySelectorAll("body *")].map(el=>{
                const r=el.getBoundingClientRect();
                return {tag:el.tagName,id:el.id||"",cls:(typeof el.className==="string"?el.className:"").slice(0,90),left:r.left,right:r.right,width:r.width};
              }).filter(r=>r.width>1 && (r.left < -1 || r.right > innerWidth+1));
              return {
                name,title:document.title,viewport:innerWidth,documentWidth:root.scrollWidth,
                horizontalOverflow:root.scrollWidth>innerWidth+1,
                visiblePanel:!!p&&!p.hidden,panelText:p?p.innerText.slice(0,800):"",
                snapshotVisible:!!document.querySelector("#homeSnapshot")&&!document.querySelector("#homeSnapshot").hidden,
                overflows:rects.slice(0,20)
              };
            },{name,panel});
            report.push({team,width,mode,...state,errors:[...errors]});
          }

          async function makeContext(browser, team, width, mode){
            const context=await browser.newContext({
              viewport:{width,height:900},deviceScaleFactor:1,serviceWorkers:"block",reducedMotion:"no-preference"
            });
            const page=await context.newPage();
            const errors=[];
            page.on("console",m=>{ if(m.type()==="error" && !/ERR_FAILED/.test(m.text())) errors.push("console: "+m.text()); });
            page.on("pageerror",e=>errors.push("pageerror: "+e.message));
            await routeESPN(page,team,mode);
            await page.goto(base+"?team="+team,{waitUntil:"domcontentloaded",timeout:30000});
            await page.waitForTimeout(1600);
            return {context,page,errors};
          }

          const browser=await chromium.launch({headless:true});
          for(const team of teams){
            for(const width of widths){
              // Normal upcoming state: all five destinations.
              {
                const {context,page,errors}=await makeContext(browser,team,width,"pre");
                for(const [name,tab,panel] of tabs){
                  if(name!=="home"){
                    await page.click(tab);
                    await page.waitForTimeout(900);
                  }
                  await measure(page,team,width,name,"pre",panel,errors);
                  await page.screenshot({path:`visual-qa/${team}-${width}-${name}-pre.png`,fullPage:true});
                }
                await context.close();
              }
              // Live state: Home + Game.
              {
                const {context,page,errors}=await makeContext(browser,team,width,"live");
                await measure(page,team,width,"home","live","#panel-schedule",errors);
                await page.screenshot({path:`visual-qa/${team}-${width}-home-live.png`,fullPage:true});
                await page.click("#tab-game"); await page.waitForTimeout(900);
                await measure(page,team,width,"game","live","#panel-game",errors);
                await page.screenshot({path:`visual-qa/${team}-${width}-game-live.png`,fullPage:true});
                await context.close();
              }
              // Final state: Game Center held on the just-finished game.
              {
                const {context,page,errors}=await makeContext(browser,team,width,"final");
                await page.click("#tab-game"); await page.waitForTimeout(900);
                await measure(page,team,width,"game","final","#panel-game",errors);
                await page.screenshot({path:`visual-qa/${team}-${width}-game-final.png`,fullPage:true});
                await context.close();
              }
            }
          }
          await browser.close();
          fs.writeFileSync("visual-qa/report.json",JSON.stringify(report,null,2));
          JS
          node visual-qa-runner.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: suite-vnext-mobile-qa
          path: visual-qa/
          if-no-files-found: error
