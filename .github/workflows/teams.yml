# Every team, Home and Game (decision 0048; David, 2026-11-25: "This need to
# work for all 138 teams ... we don't need a nightly sweep"). Each pull
# request checks the twelve colour-extreme teams (teamcheck.js in the
# Checks); this runs the same check over all 138:
#
#   after a merge that changes the look (the page, its styles, the teams'
#   configs or the art)
#   Thursdays in season (August to January), before the weekend's games
#   on demand
#
# It reports; it does not gate anything.
name: All teams

on:
  push:
    branches: [main]
    paths: ["app.css", "index.html", "suite/**", "teamos/**", "leagues/**", "assets/**", "teams/**", "tools/teamcheck.js", "tools/lib/stage.js", "tools/a11yaudit.js"]
  schedule:
    - cron: "37 13 * 8-12,1 4"     # Thursdays 8:37 a.m. Eastern (EST), August to January
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer merge's run replaces one still going
  group: all-teams
  cancel-in-progress: true

jobs:
  teams:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: teams (${{ matrix.shard }}/6)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Home and Game, every team in this shard
        env:
          TEAMS: all
          TEAM_SHARD: ${{ matrix.shard }}/6
          ALLOW_PROVIDER_IMAGES: "1"
        run: node tools/teamcheck.js
