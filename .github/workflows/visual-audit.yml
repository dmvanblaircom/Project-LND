# The 2026-11-13 visual audit, drawn again on GitHub's runner, which can
# reach ESPN's image host: real team marks, headshots and story photos in
# place of the sandbox's fallbacks (David, 2026-11-17). Captures every
# screen with docs/design/audit/2026-11-13/capture-audit.js, then replaces
# the images the audit already cites, and commits them to this branch.
# Temporary: removed before the branch merges.
name: Visual audit (runner pass)

on:
  push:
    branches: [docs/visual-audit-2026-11-13]
    paths: [".github/workflows/visual-audit.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture every screen
        run: node docs/design/audit/2026-11-13/capture-audit.js . /tmp/shots
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/shots
          retention-days: 3

  commit:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shots
          path: /tmp/shots
      - name: Replace the cited images with the runner's
        run: |
          set -euo pipefail
          D=docs/design/audit/2026-11-13
          n=0
          for f in "$D"/*.jpg; do
            b=$(basename "$f")
            if [ -f "/tmp/shots/$b" ]; then cp "/tmp/shots/$b" "$f"; n=$((n+1)); else echo "::warning::not captured on the runner: $b"; fi
          done
          cp /tmp/shots/capture-log.json "$D/capture-log-runner.json"
          echo "replaced $n images"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Visual audit: the cited images drawn on the runner, with real marks, headshots and photos"
          git push
