# Deploys Suite's edge API (worker/, decision 0030) to Cloudflare Workers
# when worker/ changes on main, or from the Actions tab.
#
# Needs repository secrets (docs/engineering/edge-api.md):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  - where it deploys
#   CFBD_API_KEY                                  - set as a Worker secret
#   REFRESH_CLOCK_TOKEN (optional)                - the refresh clock's token,
#                                                   set as a Worker secret when present
# Until they exist, the job says so and stops green: nothing half-deploys.
name: Deploy the edge API

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml", "teams/index.js", "tools/build-worker-schools.js"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22: the game-alert checks use node:sqlite (W19).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is Cloudflare configured?
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOCK: ${{ secrets.REFRESH_CLOCK_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare secrets are not set yet (docs/engineering/edge-api.md); nothing deployed."; fi
          # Worker secrets to set: the clock's only once it exists, so a
          # missing token never fails the deploy.
          { echo "secrets<<EOF"; echo "CFBD_API_KEY"; [ -n "$CLOCK" ] && echo "REFRESH_CLOCK_TOKEN"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      # The schools the CFBD route answers for, from the registry as it is
      # now: a deploy is never older than the registry it came from.
      - name: The school list follows the registry
        if: steps.ready.outputs.ok == 'true'
        run: node tools/build-worker-schools.js
      - name: The edge API passes its checks
        if: steps.ready.outputs.ok == 'true'
        run: node tools/workercheck.mjs
      - name: Deploy
        id: deploy
        if: steps.ready.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: ${{ steps.ready.outputs.secrets }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          REFRESH_CLOCK_TOKEN: ${{ secrets.REFRESH_CLOCK_TOKEN }}
      - name: It answers
        if: steps.ready.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          [ -n "$URL" ] || { echo "::warning::no deployment URL reported; check the Cloudflare dashboard"; exit 0; }
          # The version this commit deploys. Cloudflare keeps serving the old
          # one for a little while after a deploy (Oct 1: the clock deploy's
          # check got edge-2026-10-01b back), and a new Worker's address can
          # 404 at first: wait up to 3 minutes for THIS version to answer.
          want=$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' worker/src/index.js)
          [ -n "$want" ] || { echo "::error::no VERSION in worker/src/index.js"; exit 1; }
          for i in $(seq 1 36); do
            body=$(curl -sS "$URL/v1/health" || true)
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q "\"version\":\"$want\""; then
              echo "$URL/v1/health -> $body"
              echo "$body" | grep -q '"clock":true' || echo "::warning::the refresh clock has no token yet (REFRESH_CLOCK_TOKEN): no clock-started refreshes"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/v1/health did not answer with $want within 3 minutes: $body"; exit 1
      # The CFBD route end to end: real key, real CFBD, one real team. Prints
      # which fields came back and whether they are numbers - never a value,
      # because this log is public and CFBD's data may not be republished.
      - name: CFBD answers through it
        if: steps.ready.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          [ -n "$URL" ] || exit 0
          year=$(date -u +%Y); [ "$(date -u +%-m)" -lt 7 ] && year=$((year-1))
          curl -sS --retry 3 "$URL/v1/cfbd/season?team=Notre%20Dame&year=$year" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          if "error" in d:
              sys.exit("::error::the CFBD route answered an error: " + d["error"])
          s = d.get("stats") or {}
          print("source=%s stale=%s fields=%s" % (d.get("source"), d.get("stale", False), sorted(s)))
          want = {"games", "rushingYardsOpponent", "netPassingYardsOpponent"}
          missing = want - set(k for k, v in s.items() if isinstance(v, (int, float)))
          if missing:
              sys.exit("::error::missing or non-numeric: %s" % sorted(missing))
          print("all three fields present and numeric")'

