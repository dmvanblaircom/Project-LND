name: Suite vNext final acceptance QA

on:
  push:
    branches: ["design/suite-vnext-build"]
    paths: [".github/workflows/vnext-final-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Serve Suite
        run: |
          python3 -m http.server 8000 > /tmp/suite-http.log 2>&1 &
          sleep 2

      - name: Run final Suite acceptance pass
        run: |
          cat > final-qa-runner.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "fs";

          const base = "http://127.0.0.1:8000/";
          const active = {
            "notre-dame": { id:"87", name:"Notre Dame", full:"Notre Dame Fighting Irish", nick:"Fighting Irish", abbr:"ND" },
            "ohio-state": { id:"194", name:"Ohio State", full:"Ohio State Buckeyes", nick:"Buckeyes", abbr:"OSU" }
          };
          const tabs = [
            ["home","#tab-schedule","#panel-schedule"],
            ["top25","#tab-around","#panel-around"],
            ["game","#tab-game","#panel-game"],
            ["depth","#tab-depth","#panel-depth"],
            ["news","#tab-news","#panel-news"]
          ];
          const report={wide:[],keyboard:null,switching:null,offline:null};
          fs.mkdirSync("final-qa",{recursive:true});

          function assert(ok,msg){ if(!ok) throw new Error(msg); }
          function raw(name){ return JSON.parse(fs.readFileSync("tools/fixtures/"+name+".json","utf8")); }
          function forTeam(value, team){
            if(team==="notre-dame") return structuredClone(value);
            let s=JSON.stringify(value);
            s=s.replaceAll("Notre Dame Fighting Irish","Ohio State Buckeyes");
            s=s.replaceAll("Fighting Irish","Buckeyes");
            s=s.replaceAll("Notre Dame Stadium","Ohio Stadium");
            s=s.replaceAll("Notre Dame","Ohio State");
            s=s.replaceAll('"87"','"194"');
            s=s.replaceAll('"ND"','"OSU"');
            return JSON.parse(s);
          }
          function schedule(team, live=false){
            const d=forTeam(raw("espn-schedule"),team);
            if(!live) return d;
            const src=d.events.find(x=>x.id==="401858438") || d.events[0];
            const e=structuredClone(src), comp=e.competitions[0];
            e.date=new Date(Date.now()-90*60*1000).toISOString();
            comp.status={type:{state:"in",shortDetail:"3:23 - 2nd"}};
            const mine=comp.competitors.find(x=>String(x.id)===active[team].id);
            const other=comp.competitors.find(x=>String(x.id)!==active[team].id);
            if(mine){ mine.score={value:13,displayValue:"13"}; mine.winner=false; }
            if(other){ other.score={value:10,displayValue:"10"}; other.winner=false; }
            return {events:[e]};
          }
          function seasonStats(team,key){
            const d=forTeam(raw("espn-season-stats"),team);
            return d.teams[String(key)] || d.teams[active[team].id] || Object.values(d.teams)[0];
          }
          async function routeESPN(page, teamRef, live=false){
            await page.route("**/*", async route=>{
              const url=route.request().url();
              if(!/espn\.com/.test(url)) return route.continue();
              const team=teamRef();
              let body=null;
              if(/\/summary\?event=/.test(url)) body=forTeam(raw(live?"espn-summary-live":"espn-summary-pre"),team);
              else if(/\/rankings(?:\?|$)/.test(url)) body=forTeam(raw("espn-rankings"),team);
              else if(/\/scoreboard\?/.test(url)) body=forTeam(raw("espn-scoreboard"),team);
              else if(/\/news\?team=/.test(url)) body=forTeam(raw("espn-news"),team);
              else if(/\/roster(?:\?|$)/.test(url)) body=forTeam(raw("espn-roster"),team);
              else if(/\/statistics(?:\?|$)/.test(url)){
                const m=url.match(/\/teams\/(\d+)\/statistics/);
                body=seasonStats(team,m?m[1]:active[team].id);
              } else if(/\/schedule(?:\?|$)/.test(url)) body=schedule(team,live);
              else {
                const m=url.match(/\/teams\/(\d+)(?:\?|$)/);
                if(m && m[1]===active[team].id) body=forTeam(raw("espn-team"),team);
              }
              if(body) return route.fulfill({status:200,contentType:"application/json",body:JSON.stringify(body)});
              return route.abort();
            });
          }
          async function state(page,panel){
            return page.evaluate(panel=>{
              const root=document.documentElement, p=document.querySelector(panel);
              return {
                title:document.title,
                width:innerWidth,
                docWidth:root.scrollWidth,
                overflow:root.scrollWidth>innerWidth+1,
                panelVisible:!!p&&!p.hidden,
                panelText:p?p.innerText.slice(0,500):"",
                team:root.getAttribute("data-team")
              };
            },panel);
          }
          async function cacheState(page){
            return page.evaluate(async()=>{
              const names=await caches.keys();
              const shellName=names.find(x=>/-shell$/.test(x));
              const dataName=names.find(x=>/-data$/.test(x));
              let mark=null, data=[];
              if(shellName){
                const c=await caches.open(shellName), r=await c.match("./__team");
                if(r) mark=await r.json();
              }
              if(dataName){
                const c=await caches.open(dataName);
                data=(await c.keys()).map(r=>r.url);
              }
              return {names,shellName,dataName,mark,data};
            });
          }
          async function waitMark(page,id){
            for(let i=0;i<50;i++){
              const c=await cacheState(page);
              if(c.mark && c.mark.team===id) return c;
              await page.waitForTimeout(200);
            }
            throw new Error("service worker never adopted "+id);
          }
          function collectErrors(page){
            const errors=[];
            page.on("console",m=>{ if(m.type()==="error" && !/ERR_FAILED|Failed to load resource/.test(m.text())) errors.push("console: "+m.text()); });
            page.on("pageerror",e=>errors.push("pageerror: "+e.message));
            return errors;
          }

          const browser=await chromium.launch({headless:true});

          for(const team of ["notre-dame","ohio-state"]){
            for(const width of [768,1280]){
              const context=await browser.newContext({viewport:{width,height:1000},serviceWorkers:"block"});
              const page=await context.newPage(), errors=collectErrors(page);
              let current=team;
              await routeESPN(page,()=>current,false);
              await page.goto(base+"?team="+team,{waitUntil:"domcontentloaded"});
              await page.waitForTimeout(1400);
              for(const [name,tab,panel] of tabs){
                if(name!=="home"){ await page.click(tab); await page.waitForTimeout(500); }
                const st=await state(page,panel);
                assert(st.panelVisible,team+" "+width+" "+name+" panel hidden");
                assert(!st.overflow,team+" "+width+" "+name+" horizontal overflow");
                report.wide.push({team,width,name,...st,errors:[...errors]});
                await page.screenshot({path:"final-qa/"+team+"-"+width+"-"+name+".png",fullPage:true});
              }
              assert(errors.length===0,team+" "+width+" console errors: "+errors.join(" | "));
              await context.close();
            }
            const context=await browser.newContext({viewport:{width:1280,height:1000},serviceWorkers:"block"});
            const page=await context.newPage(), errors=collectErrors(page);
            let current=team;
            await routeESPN(page,()=>current,true);
            await page.goto(base+"?team="+team,{waitUntil:"domcontentloaded"});
            await page.waitForTimeout(1200);
            await page.click("#tab-game"); await page.waitForTimeout(700);
            const live=await state(page,"#panel-game");
            assert(!live.overflow && live.panelVisible,team+" wide live Game failed");
            assert(/Playing|LIVE|3:23|13/.test(live.panelText),team+" wide live Game lacks live context");
            await page.screenshot({path:"final-qa/"+team+"-1280-game-live.png",fullPage:true});
            assert(errors.length===0,team+" wide live console errors: "+errors.join(" | "));
            await context.close();
          }

          {
            const context=await browser.newContext({viewport:{width:1024,height:900},serviceWorkers:"block"});
            const page=await context.newPage(), errors=collectErrors(page);
            let current="notre-dame";
            await routeESPN(page,()=>current,false);
            await page.goto(base+"?team=notre-dame",{waitUntil:"domcontentloaded"});
            await page.waitForTimeout(1200);
            await page.focus("#tab-schedule");
            const focusStyle=await page.evaluate(()=>{
              const e=document.activeElement, s=getComputedStyle(e);
              return {id:e.id,outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,outlineColor:s.outlineColor};
            });
            assert(focusStyle.id==="tab-schedule","Home tab did not receive focus");
            assert(focusStyle.outlineStyle!=="none" && focusStyle.outlineWidth!=="0px","focused Home tab has no visible outline");
            await page.keyboard.press("ArrowRight");
            const right=await page.evaluate(()=>({id:document.activeElement.id,selected:document.activeElement.getAttribute("aria-selected"),around:document.querySelector("#panel-around").hidden}));
            assert(right.id==="tab-around" && right.selected==="true" && right.around===false,"ArrowRight did not select Top 25");
            await page.keyboard.press("End");
            const end=await page.evaluate(()=>({id:document.activeElement.id,selected:document.activeElement.getAttribute("aria-selected"),news:document.querySelector("#panel-news").hidden}));
            assert(end.id==="tab-news" && end.selected==="true" && end.news===false,"End did not select News");
            await page.keyboard.press("Home");
            const home=await page.evaluate(()=>({id:document.activeElement.id,selected:document.activeElement.getAttribute("aria-selected"),home:document.querySelector("#panel-schedule").hidden}));
            assert(home.id==="tab-schedule" && home.selected==="true" && home.home===false,"Home key did not return to Home");
            assert(errors.length===0,"keyboard walkthrough console errors: "+errors.join(" | "));
            report.keyboard={focusStyle,right,end,home,errors};
            await context.close();
          }

          {
            const context=await browser.newContext({viewport:{width:430,height:900},serviceWorkers:"allow"});
            const page=await context.newPage(), errors=collectErrors(page);
            let current="notre-dame";
            await routeESPN(page,()=>current,false);

            await page.goto(base+"?team=notre-dame",{waitUntil:"domcontentloaded"});
            await page.waitForTimeout(1200);
            await page.evaluate(async()=>{
              await navigator.serviceWorker.ready;
              if(!navigator.serviceWorker.controller){
                await new Promise(resolve=>navigator.serviceWorker.addEventListener("controllerchange",resolve,{once:true}));
              }
            });
            const nd=await waitMark(page,"notre-dame");
            assert(nd.data.some(u=>/\/depth\.json$/.test(new URL(u).pathname)),"ND depth snapshot was not cached");

            current="ohio-state";
            await page.goto(base+"?team=ohio-state",{waitUntil:"domcontentloaded"});
            await page.waitForTimeout(1000);
            const osu=await waitMark(page,"ohio-state");
            assert(await page.title()==="Buckeye Watch · Ohio State Football","Ohio State switch did not apply identity");
            assert(!osu.data.some(u=>/\/(depth|depth-history|news|odds-history)\.json$/.test(new URL(u).pathname)),"ND team snapshots leaked into Ohio State data cache");
            await page.click("#tab-depth"); await page.waitForTimeout(600);
            const osuDepth=await state(page,"#panel-depth");
            assert(/not available|Roster/i.test(osuDepth.panelText),"Ohio State did not show honest no-depth state");

            current="notre-dame";
            await page.goto(base+"?team=notre-dame",{waitUntil:"domcontentloaded"});
            await page.waitForTimeout(1000);
            const nd2=await waitMark(page,"notre-dame");
            assert(await page.title()==="Irish Watch · Notre Dame Football","ND switch-back did not restore identity");
            assert(nd2.data.some(u=>/\/depth\.json$/.test(new URL(u).pathname)),"ND depth snapshot was not restored after switch-back");

            await context.setOffline(true);
            await page.reload({waitUntil:"domcontentloaded"});
            await page.waitForTimeout(1000);
            assert(await page.title()==="Irish Watch · Notre Dame Football","offline shell did not restore Notre Dame");
            await page.click("#tab-depth"); await page.waitForTimeout(700);
            const off=await state(page,"#panel-depth");
            assert(off.panelVisible && /Depth|Personnel|Roster/i.test(off.panelText),"offline Depth did not render from cache");
            assert(!/didn.t load|failed/i.test(off.panelText),"offline Depth fell into failure state");
            const stored=await page.evaluate(()=>localStorage.getItem("iw-team"));
            assert(stored==="notre-dame","offline team preference changed unexpectedly");
            report.switching={ndMark:nd.mark,osuMark:osu.mark,ndBackMark:nd2.mark,osuDepth:osuDepth.panelText};
            report.offline={title:await page.title(),depth:off.panelText,storedTeam:stored};
            await context.setOffline(false);
            assert(errors.length===0,"switch/offline console errors: "+errors.join(" | "));
            await context.close();
          }

          await browser.close();
          fs.writeFileSync("final-qa/report.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify({
            wideStates:report.wide.length,
            keyboard:report.keyboard,
            switching:report.switching,
            offline:report.offline
          },null,2));
          JS
          node final-qa-runner.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: suite-vnext-final-qa
          path: final-qa/
          if-no-files-found: error
