# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Raw contexts (probe branch only)
        run: |
          curl -sSL -A "Mozilla/5.0" "https://bigten.org/sports/2026/9/10/FB_Availability_Reports.aspx" -o hub.html || true
          grep -oiE '<iframe[^>]*>' hub.html | sed 's/&amp;/\&/g' | grep -vi 'display:none' | head
          SRC=$(grep -oiE '<iframe[^>]*embedded-app[^>]*>' hub.html | grep -oiE 'src="[^"]*"' | head -1 | sed 's/^src="//;s/"$//;s/&amp;/\&/g')
          echo "SRC=$SRC"
          python3 -c "import sys,urllib.parse as u;q=u.parse_qs(u.urlparse(sys.argv[1]).query);print('decoded:',q.get('url',[sys.argv[1]])[0])" "$SRC" | tee dec.txt
          U=$(sed 's/^decoded: //' dec.txt)
          curl -sSL -A "Mozilla/5.0" "$U" -o app.html -w "app HTTP %{http_code} %{content_type} %{size_download}\n" || true
          head -c 3000 app.html; echo
          grep -oiE '(src|href)="[^"]+"' app.html | sort -u | head -40
          grep -oiE '"[^"]*(api|\.json|graphql|\.pdf)[^"]*"' app.html | sort -u | head -40
