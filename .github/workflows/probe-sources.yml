# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt | tee probe-out.txt
      # Probe branches only: keep the output on the branch, since job logs
      # are not readable from the engineering container.
      - name: Keep the output (probe branch only)
        if: startsWith(github.ref, 'refs/heads/probe/')
        run: |
          mkdir -p tools/probe-out && mv probe-out.txt tools/probe-out/latest.txt
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/probe-out/latest.txt && git commit -qm "Probe output" && git push -q
