# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Raw contexts (probe branch only)
        run: |
          curl -sSL -A "Mozilla/5.0" "https://bigten.org/sports/2026/9/10/FB_Availability_Reports.aspx" -o hub.html || true
          wc -c hub.html
          grep -oiE '.{0,160}(\.pdf|/documents/|availability|ohio state|iframe|embed|google|drive|boxcast|dropbox)[^"<]{0,160}' hub.html | grep -viE 'MEDIA_GUIDE|Record_Book' | sort -u | head -80
