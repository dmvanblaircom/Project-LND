# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Public JSON shape (probe branch only)
        run: |
          B=https://app.hdintelligence.com
          for k in publish archive; do
            curl -sS -X POST -H 'Content-Type: application/json' -A "Mozilla/5.0" "$B/api/get-$k-public" -d '{"sport":"Football","organization":"B10","conference":"B10"}' -o $k.json -w "$k HTTP %{http_code} %{size_download}\n"
          done
          python3 tools/probe/hdi_fixture.py
