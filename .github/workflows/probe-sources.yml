# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Raw contexts (probe branch only)
        run: |
          B=https://app.hdintelligence.com
          curl -sSL -A "Mozilla/5.0" "$B/?source=B10&sport=Football&conf=B10&type=archive" -o app.html
          JS=$(grep -oE 'assets/index-[^"]+\.js' app.html | head -1); echo "JS=$JS"
          curl -sSL -A "Mozilla/5.0" "$B/$JS" -o app.js; wc -c app.js
          echo "--- base URLs"; grep -oE 'https?://[a-zA-Z0-9._-]+(/[a-zA-Z0-9._/-]*)?' app.js | grep -viE 'w3\.org|reactjs|github|mozilla|googleapis|descope\.com/(docs)|fb\.me|npm' | sort | uniq -c | sort -rn | head -40
          echo "--- public/embed/archive contexts"; grep -oE '.{0,140}(isPublicEmbedRequest|public[A-Za-z]*Report|/public|archive|type===?"report").{0,200}' app.js | head -30
          echo "--- fetch paths"; grep -oE '`[^`]{0,40}/(api|v1|public|reports?|archive)[^`]{0,120}`|"/(api|v1|public|reports?|archive)[^"]{0,120}"' app.js | sort -u | head -60
