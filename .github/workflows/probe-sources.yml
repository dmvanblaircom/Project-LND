# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Raw contexts (probe branch only)
        run: |
          B=https://app.hdintelligence.com
          curl -sSL -A "Mozilla/5.0" "$B/?source=B10&sport=Football&conf=B10&type=archive" -o app.html
          JS=$(grep -oE 'assets/index-[^"]+\.js' app.html | head -1)
          curl -sSL -A "Mozilla/5.0" "$B/$JS" -o app.js
          grep -oE '.{0,300}"/api/getSelectOptions".{0,500}' app.js | cut -c1-800
