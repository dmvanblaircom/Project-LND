# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Push status (probe branch only)
        run: |
          curl -sS --max-time 30 https://suite-api.dmvanblaircom.workers.dev/v1/push/status -o status.json -w "HTTP %{http_code} %{size_download}\n"
          jq -c 'del(.log)' status.json | head -c 6000; echo
          echo "--- log (last 60)"; jq -c '.log[-60:][]?' status.json 2>/dev/null | head -60
