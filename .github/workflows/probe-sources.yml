# Feasibility probe for new data sources (W07, issue #29): from GitHub's
# network, which is the production runner's, report what each candidate URL
# in tools/probe-urls.txt returns. Prints only; stores and commits nothing.
name: Probe data sources

on:
  push:
    paths: ["tools/probe-urls.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/probe_sources.py tools/probe-urls.txt
      - name: Raw contexts (probe branch only)
        run: |
          B=https://app.hdintelligence.com
          curl -sSL -A "Mozilla/5.0" "$B/?source=B10&sport=Football&conf=B10&type=archive" -o app.html
          JS=$(grep -oE 'assets/index-[^"]+\.js' app.html | head -1)
          curl -sSL -A "Mozilla/5.0" "$B/$JS" -o app.js
          echo "--- all /api/ strings"; grep -oE '["`]/api/[^"`]{0,100}["`]' app.js | sort | uniq -c
          echo "--- fetch( calls"; grep -oE 'fetch\([^)]{0,140}' app.js | sort -u | head -30
          echo "--- Hn create"; grep -oE '.{0,80}Hn=[^;]{0,200}' app.js | head -3
          echo "--- archive/published comps"; grep -oE '.{0,60}(archive_data|published_report|getArchive|getPublished|publishedReport|archiveData)[^;]{0,200}' app.js | head -20
          echo "--- chunks"; grep -oE 'assets/[A-Za-z0-9_-]+\.js' app.js | sort -u | head -40
          echo "--- public-load try"
          curl -sS -X POST -H 'Content-Type: application/json' -H 'Origin: https://app.hdintelligence.com' -A "Mozilla/5.0" "$B/api/public-load" -d '{"conference_param":"B10","sport_param":"Football","type_param":"archive","referrer":"https://bigten.org/","source":"B10"}' -w "\nHTTP %{http_code}\n" | head -c 3000
