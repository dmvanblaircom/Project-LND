# Survey other schools' game notes with the reader as it stands (F4: readers
# for every school's notes; tools/notes_survey.py). Prints counts, link
# labels and section headings only. With "reader", runs the notes producer
# for the named teams as a dry run instead: the snapshot it would write and
# the lines it found no player for. Either way it stores and commits nothing.
name: Survey game notes

on:
  workflow_dispatch:
    inputs:
      teams:
        description: "Team ids, comma-separated (empty: every team of the kind below)"
        default: ""
        type: string
      kind:
        description: "links.gameNotes kind to survey when no teams are named: index or schedule"
        default: "index"
        type: string
      sample:
        description: "Print a few lines of each section the app shows, not the headings"
        default: true
        type: boolean
      reader:
        description: "Dry-run the notes producer for the teams named above (they must declare notesReads), not the survey"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet beautifulsoup4 pypdf
      - name: Survey
        env:
          TEAMS: ${{ inputs.teams }}
          KIND: ${{ inputs.kind }}
          SAMPLE: ${{ inputs.sample }}
          READER: ${{ inputs.reader }}
        run: |
          if [ "$READER" = true ]; then
            for t in $(printf '%s' "$TEAMS" | tr ',' ' '); do
              case "$t" in *[!a-z0-9-]*) echo "not a team id: skipped"; continue;; esac
              echo "== $t"; python3 tools/producers/official_notes.py --team "$t" --dry-run || echo "FAILED $t"
            done
          else
            python3 tools/notes_survey.py --teams "$TEAMS" --kind "$KIND" $([ "$SAMPLE" = true ] && echo --sample)
          fi
