# Runs on every push that touches the front end. A red X here means a change
# reintroduced the override-layer problem: a responsive rule that a later base
# rule silently kills, or a property declared twice for the same selector.
name: Check the stylesheet

on:
  push:
    paths: ["app.css", "app.js", "chooser.js", "sw.js", "index.html", "tools/**", "teams/**", "teamos/**", "assets/**", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # versioncheck compares against the previous push
      - name: Dead and shadowed CSS
        run: python3 tools/csscheck.py app.css
      - name: JavaScript parses
        run: node --check app.js && node --check sw.js && for f in teams/*.js teamos/*.js tools/*.js; do node --check "$f"; done
      - name: The page knows which team it is
        run: node tools/bootcheck.js
      - name: One registry, matching the repository
        run: node tools/registrycheck.js
      - name: The chooser offers what it can open
        run: node tools/choosercheck.js
      - name: The worker caches one team at a time
        run: node tools/swcheck.js
      - name: TeamOS ESPN adapter
        run: node tools/adaptercheck.js
      - name: Every surface agrees on one live game state
        run: node tools/livecheck.js
      - name: One set of game rules - status, lifecycle, hero, preview, day/night
        run: node tools/gamecheck.js
      - name: Season Outlook, screen freshness and weather
        run: node tools/rulescheck.js
      - name: The depth chart joined to the roster, views that follow the team
        run: node tools/rostercheck.js
      - name: The matchup card agrees with the data
        run: node tools/matchupcheck.js
      - name: The depth chart parser reads the official chart as written
        run: python3 tools/depthcheck.py
      - name: The data refresh checks the depth chart when it should
        run: python3 tools/cadencecheck.py
      - name: The beat-news producer reads feeds and finds moved ones
        run: python3 tools/newscheck.py
      - name: The freshness monitor notices a missed update or a stalled clock
        run: python3 tools/freshnesscheck.py
      - name: A shell change bumps the worker version
        run: node tools/versioncheck.js "${{ github.event.before }}"
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-visual-smoke
          path: artifacts/visual
