# The checks (David, 2026-10-27: one standard set; each merge runs the ones
# its change needs). Every check is listed once, in tools/checks.json;
# tools/select-checks.js picks them by the files a pull request changes, and
# tools/run-checks.js runs them, here and locally. Anything the selector
# cannot place runs everything.
#
#   pull request into main   what its change needs, once (not again as a push)
#   push to main             everything: each merge is checked whole
#   nightly                  everything, so a check that was skipped, or a
#                            fixture that went stale, shows the same day
#
# The browser checks run in parallel shards balanced by their time, and the
# visual audit one job per width; `gate` is the one result to read.
name: Checks

on:
  push:
    branches: [main]
    # main also takes the data refresh's commits every half hour; they change
    # no code and are not checked here.
    paths: ["app.css", "app.js", "chooser.js", "sw.js", "index.html", "manifest.json", "package.json", "package-lock.json", "suite/**", "tools/**", "teams/**", "teamos/**", "leagues/**", "assets/**", "worker/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"     # 3:41 AM Eastern
  workflow_dispatch:

concurrency:
  # a new push to a pull request replaces its run still going
  group: checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.pick.outputs.unit }}
      browser: ${{ steps.pick.outputs.browser }}
      visual: ${{ steps.pick.outputs.visual }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the checks this change needs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            node tools/select-checks.js --base "$PR_BASE" --github
          else
            # the version check compares a push with the one before it
            [ "$EVENT" = push ] && echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            node tools/select-checks.js --all --github
          fi

  unit:
    needs: plan
    if: needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # versioncheck compares against the base
      # Node 22: the edge API's game-alert checks use node:sqlite to play the
      # Durable Object's SQLite (W19).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit checks
        env:
          CHECK_BASE: ${{ needs.plan.outputs.base }}
          IDS: ${{ needs.plan.outputs.unit }}
        run: node tools/run-checks.js --ids "$IDS"

  browser:
    needs: plan
    if: needs.plan.outputs.browser != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ids: ${{ fromJSON(needs.plan.outputs.browser) }}
    name: browser (${{ strategy.job-index }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        env:
          IDS: ${{ toJSON(matrix.ids) }}
        run: node tools/run-checks.js --ids "$IDS"

  visual:
    needs: plan
    if: needs.plan.outputs.visual != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: ${{ fromJSON(needs.plan.outputs.visual) }}
    name: visual (${{ matrix.width }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # The runner can reach the provider's image CDN, so CI's screenshots show
      # real team marks and player headshots; the gate also fails every
      # headshot on purpose and checks the initials fallback shows instead.
      - name: Visual audit at ${{ matrix.width }}px
        env:
          ALLOW_PROVIDER_IMAGES: "1"
          VISUAL_WIDTHS: ${{ matrix.width }}
        run: node tools/run-checks.js --ids '["visualcheck.js"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-visual-${{ matrix.width }}
          path: artifacts/visual

  # The one result: every job that ran passed, and a job the change did not
  # need was skipped, not failed.
  gate:
    needs: [plan, unit, browser, visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          echo "plan $PLAN, unit $UNIT, browser $BROWSER, visual $VISUAL"
          [ "$PLAN" = success ] || exit 1
          for r in "$UNIT" "$BROWSER" "$VISUAL"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
