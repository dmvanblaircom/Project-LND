# Capture real ESPN game summaries as test fixtures, from GitHub's network
# (the development environment cannot reach ESPN). Trims each to the keys
# TeamOS reads (tools/trim_summary.py) and commits it to the branch it ran
# on. Decision 0023: drive and play normalization is built from real
# payloads, not invented ones.
#
# Two ways in: edit tools/fixtures/capture-requests.txt on any branch and
# push (one "<event id> <name>" per line; a fixture already on disk is not
# fetched again), or, once this file is on the default branch, run it from
# the Actions tab with an event id and a name.
name: Capture game-summary fixtures

on:
  push:
    paths: ["tools/fixtures/capture-requests.txt"]
  workflow_dispatch:
    inputs:
      event:
        description: "ESPN event id, e.g. 401858438"
        required: true
        type: string
      name:
        description: "Fixture name: tools/fixtures/espn-summary-<name>.json"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and trim
        env:
          EVENT: ${{ inputs.event }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT:-}" ]; then echo "$EVENT $NAME" > requests.tmp
          else grep -Ev '^\s*(#|$)' tools/fixtures/capture-requests.txt > requests.tmp || true; fi
          API="https://site.api.espn.com/apis/site/v2/sports/football/college-football"
          while read -r ev name; do
            [[ "$name" =~ ^[a-z0-9-]+$ ]] || { echo "::warning::skipping bad name '$name'"; continue; }
            # "<event id> <name>"            a game summary
            # "rankings <name>"              this week's polls
            # "scoreboard-YYYYMMDD <name>"   the FBS scoreboard for that date's week
            # "schedule-<team id> <name>"    a team's season schedule
            # "schedule-<id>-<YYYY>[-<type>] <name>"  a given season (type 3 = postseason)
            # "roster-<team id> <name>"      a team's roster
            # "news-<team id> <name>"        a team's news feed, links and images kept
            # "fpi-<YYYY> <name>"             ESPN FPI for a season, every FBS team
            # "news-images <name>"           the photos of espn-news-<name>.json, for review renders
            # "teamstats-<id>-<YYYY>-<type> <name>"   a team's full season statistics, core API (W27)
            # "leaders-<id>-<YYYY>-<type> <name>"     a team's season leaders, core API (W27 candidate)
            # "athletestats-<athlete id>-<YYYY>-<type> <name>"  one player's season, core API (W27 candidate)
            # "sitestats-<id> <name>"         a team's statistics, site API (W27 candidate)
            # The W27 kinds keep the payload whole ($ref links included: they show
            # what each call points at), and a candidate that answers 404 is a
            # finding, not a failure: it is noted and the run goes on.
            if [[ "$ev" =~ ^[0-9]+$ ]]; then
              out="tools/fixtures/espn-summary-$name.json"; url="$API/summary?event=$ev"; kind=summary
            elif [ "$ev" = "rankings" ]; then
              out="tools/fixtures/espn-rankings-$name.json"; url="$API/rankings"; kind=payload
            elif [[ "$ev" =~ ^roster-([0-9]+)$ ]]; then
              out="tools/fixtures/espn-roster-$name.json"; kind=payload
              url="$API/teams/${BASH_REMATCH[1]}/roster"
            elif [ "$ev" = "news-images" ]; then
              dir="tools/fixtures/img/news-$name"
              if [ -z "${EVENT:-}" ] && [ -f "$dir/manifest.json" ]; then echo "  $dir exists"; continue; fi
              python3 tools/capture_images.py "tools/fixtures/espn-news-$name.json" "$dir" 20
              continue
            elif [[ "$ev" =~ ^news-([0-9]+)$ ]]; then
              out="tools/fixtures/espn-news-$name.json"; kind=news
              url="$API/news?team=${BASH_REMATCH[1]}&limit=30"
            elif [[ "$ev" =~ ^schedule-([0-9]+)$ ]]; then
              out="tools/fixtures/espn-schedule-$name.json"; kind=payload
              url="$API/teams/${BASH_REMATCH[1]}/schedule"
            elif [[ "$ev" =~ ^schedule-([0-9]+)-([0-9]{4})(-([0-9]))?$ ]]; then
              # a given season, and optionally a season type (2 regular, 3 postseason)
              out="tools/fixtures/espn-schedule-$name.json"; kind=payload
              url="$API/teams/${BASH_REMATCH[1]}/schedule?season=${BASH_REMATCH[2]}"
              [ -n "${BASH_REMATCH[4]}" ] && url="$url&seasontype=${BASH_REMATCH[4]}"
            elif [[ "$ev" =~ ^fpi-([0-9]{4})$ ]]; then
              # ESPN's Football Power Index, every FBS team (W07, issue #29)
              out="tools/fixtures/espn-fpi-$name.json"; kind=payload
              url="https://site.web.api.espn.com/apis/fitt/v3/sports/football/college-football/powerindex?region=us&lang=en&season=${BASH_REMATCH[1]}&limit=200"
            elif [[ "$ev" =~ ^(teamstats|leaders|athletestats)-([0-9]+)-([0-9]{4})-([0-9])$ ]]; then
              CORE="https://sports.core.api.espn.com/v2/sports/football/leagues/college-football"
              kind=raw; which="${BASH_REMATCH[1]}"; out="tools/fixtures/espn-$which-$name.json"
              case "$which" in
                teamstats)    url="$CORE/seasons/${BASH_REMATCH[3]}/types/${BASH_REMATCH[4]}/teams/${BASH_REMATCH[2]}/statistics" ;;
                leaders)      url="$CORE/seasons/${BASH_REMATCH[3]}/types/${BASH_REMATCH[4]}/teams/${BASH_REMATCH[2]}/leaders" ;;
                athletestats) url="$CORE/seasons/${BASH_REMATCH[3]}/types/${BASH_REMATCH[4]}/athletes/${BASH_REMATCH[2]}/statistics" ;;
              esac
            elif [[ "$ev" =~ ^sitestats-([0-9]+)$ ]]; then
              kind=raw; out="tools/fixtures/espn-sitestats-$name.json"
              url="$API/teams/${BASH_REMATCH[1]}/statistics"
            elif [[ "$ev" =~ ^scoreboard-([0-9]{8})$ ]]; then
              out="tools/fixtures/espn-scoreboard-$name.json"; kind=payload
              url="$API/scoreboard?groups=80&limit=400&dates=${BASH_REMATCH[1]}"
            else echo "::warning::skipping bad request '$ev'"; continue; fi
            if [ -z "${EVENT:-}" ] && [ -f "$out" ]; then echo "  $out exists"; continue; fi
            echo "  fetching $out"
            if [ "$kind" = raw ]; then
              code=$(curl -sS --retry 3 -o raw.json -w '%{http_code}' "$url" || echo 000)
              if [ "$code" != 200 ]; then echo "::warning::$url answered $code - noted, not captured"; rm -f raw.json; continue; fi
              python3 -c 'import json,sys; d=json.load(open("raw.json")); json.dump({"_comment": sys.argv[2], **(d if isinstance(d, dict) else {"items": d})}, open(sys.argv[1], "w"), indent=1)' \
                "$out" "Real ESPN payload, captured $(date -u +%Y-%m-%dT%H:%MZ) by capture-fixture.yml from $url, kept whole (W27 season stats, Phase 0)."
              rm -f raw.json; continue
            fi
            curl -sSf --retry 3 -o raw.json "$url"
            if [ "$kind" = summary ]; then
              python3 tools/trim_summary.py raw.json "$out" \
                "Real ESPN game summary for event $ev, captured $(date -u +%Y-%m-%d) by capture-fixture.yml and trimmed to the keys TeamOS reads (tools/trim_summary.py). ESPN's structure and positions are unchanged."
            elif [ "$kind" = news ]; then
              python3 tools/trim_payload.py --news raw.json "$out" \
                "Real ESPN news feed, captured $(date -u +%Y-%m-%dT%H:%MZ) by capture-fixture.yml from $url; only other systems' ids removed (tools/trim_payload.py --news)."
            else
              python3 tools/trim_payload.py raw.json "$out" \
                "Real ESPN $ev payload, captured $(date -u +%Y-%m-%dT%H:%MZ) by capture-fixture.yml from $url and cut of logos, links and other bulk no screen reads (tools/trim_payload.py). ESPN's structure and positions are unchanged."
            fi
            rm -f raw.json
          done < requests.tmp
          rm -f requests.tmp
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/espn-summary-*.json tools/fixtures/espn-rankings-*.json tools/fixtures/espn-scoreboard-*.json tools/fixtures/espn-schedule-*.json tools/fixtures/espn-roster-*.json tools/fixtures/espn-news-*.json tools/fixtures/espn-fpi-*.json tools/fixtures/espn-teamstats-*.json tools/fixtures/espn-leaders-*.json tools/fixtures/espn-athletestats-*.json tools/fixtures/espn-sitestats-*.json tools/fixtures/img
          git diff --cached --quiet && { echo "no new fixtures"; exit 0; }
          git commit -m "Capture ESPN fixtures"
          git pull --rebase -q && git push
