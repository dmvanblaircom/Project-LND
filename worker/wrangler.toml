# Suite's edge API (decision 0030). Deployed by .github/workflows/worker.yml.
# Secrets (CFBD_API_KEY) are set by that workflow from GitHub secrets and
# never live in this repository.
name = "suite-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# The data refresh clock (W02): start "Refresh team data" at :07 and :37 every
# hour, off the hour like the workflow's own schedule. UTC.
[triggers]
crons = ["7,37 * * * *"]
