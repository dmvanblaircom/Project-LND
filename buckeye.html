<!DOCTYPE html>
<!-- Buckeye Watch moved.

     This page existed for one day, because the site could only deploy one
     team and Ohio State needed somewhere to be looked at. Phase 7 made the
     team a choice the page resolves at run time, so the address is now
     ?team=ohio-state on the site itself and there is no second page to keep
     in step with the first.

     The redirect stays because links were shared. It can go once they have
     all been followed at least once. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buckeye Watch</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=./?team=ohio-state">
<link rel="canonical" href="./?team=ohio-state">
<script>location.replace("./?team=ohio-state" + location.hash);</script>
</head>
<body>
<p>Buckeye Watch is now at <a href="./?team=ohio-state">?team=ohio-state</a>.</p>
</body>
</html>
