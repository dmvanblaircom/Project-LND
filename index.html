<!-- Which team this page is, decided before anything else runs.

     Order: ?team= (so a link can carry it), then the last choice this browser
     made, then the default. The choice is stored, so the next visit opens the
     same Suite with no query string.

     Then the colours. app.css declares a team-NEUTRAL :root so the page can
     paint at all - the team's own tokens live in teams/<id>.js, which has not
     loaded yet. Rather than duplicate them here, paintIdentity() writes the
     set it applied into localStorage and this replays it: the first visit to
     a team paints neutral for a moment, every visit after paints the team,
     and there is nothing to keep in sync. A stored set is only ever replayed
     under the team it was stored for, so one team can never flash in
     another's colours - which is the bug of 2026-09-21, in the form it would
     come back.

     Then the scripts, in order. They used to be eight tags in the markup,
     which is what made the team "whichever file the markup names" and why
     buckeye.html had to exist. app.js reads the DOM as it runs, so it is
     injected at DOMContentLoaded; nothing before it needs a DOM. -->
<script id="team-boot">
(function(){
  "use strict";
  var DEFAULT  = "notre-dame";                  // until a fan has chosen; 7C replaces this with the chooser
  var ID       = /^[a-z0-9-]+$/;                // an id becomes a file path, so it is shape-checked here
  var TEAM_KEY = "iw-team", BOOT_KEY = "iw-boot-";

  function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  // The URL wins, then the last choice this browser made, then the default.
  // There is deliberately NO list of known teams here: teams/index.js is the
  // one registry (decision 0014), and it has not loaded yet. An id that names
  // no config simply fails to load, and onerror below falls back - which also
  // covers a team removed from the registry after someone bookmarked it.
  var asked = null;
  try { asked = new URLSearchParams(location.search).get("team"); } catch(e){}
  var id = null;
  [asked, get(TEAM_KEY)].some(function(t){
    if (t && ID.test(t)) { id = t; return true; }
    return false;
  });
  // NOTHING ASKED AND NOTHING STORED is a real state, not a reason to guess.
  // A fan arriving for the first time has not picked a team, and picking one
  // for them means whoever gets here first sees somebody else's club. The
  // chooser is what happens instead (decision 0016); app.js is not loaded at
  // all, because there is no team for it to render.
  var choosing = !id;

  // CHANGING TEAM is the other way to reach the chooser (decision 0022 #7):
  // an established fan, from Settings, with a team already chosen. The
  // chooser shows, but the current team is KEPT - stored, and named on the
  // page so the chooser can offer Cancel back to it. Nothing is forgotten
  // until a new team is actually picked.
  var changing = false;
  try { changing = new URLSearchParams(location.search).has("change"); } catch(e){}
  var current = null;
  if (changing && id && !asked) { current = id; choosing = true; }

  if (!choosing && id !== get(TEAM_KEY)) set(TEAM_KEY, id);
  document.documentElement.setAttribute("data-team", choosing ? "" : id);
  if (current) document.documentElement.setAttribute("data-current-team", current);

  // Replay what this browser last saw for THIS team. Values come from the
  // page's own storage, but they are still read as data: a token name has to
  // look like one, and a value carrying CSS punctuation is dropped.
  var saved = null;
  try { saved = choosing ? null : JSON.parse(get(BOOT_KEY + id) || "null"); } catch(e){}
  // The browser chrome, decided once at the end. iOS takes theme-color at
  // first paint and keeps it, so it must never be left pointing at the
  // DEFAULT team's colour when this page is some other team
  // (docs/engineering/first-paint-team-tokens.md). Preference: what the team
  // stored, then the header colour we actually applied, then the neutral; on
  // the chooser, the Suite's own header. A value that is not a plain hex
  // colour is not used at all.
  var hex = /^#[0-9a-f]{6}$/i, chrome = choosing ? "#0B1F3A" : "#0C0F13";   // --s-chrome / --t-deep, the neutral

  if (saved && typeof saved === "object") {
    // Values come from this page's own storage, but they are read as data:
    // a token name has to look like one, and anything carrying CSS
    // punctuation or a fetch is dropped.
    var root = document.documentElement.style, k, v;
    for (k in saved) {
      v = saved[k];
      if (!/^--[a-z-]+$/.test(k) || typeof v !== "string") continue;
      if (/[;{}<>\\]|url\(/i.test(v)) continue;
      root.setProperty(k, v);
      if (k === "--t-deep" && hex.test(v)) chrome = v;
    }
    // Only a title in the Suite's own form: a set stored before decision 0024
    // carried a team product name, which is no longer customer-facing.
    if (typeof saved.title === "string" && / \u00B7 Suite$/.test(saved.title)) document.title = saved.title;
    if (typeof saved.themeColor === "string" && hex.test(saved.themeColor)) chrome = saved.themeColor;
  }
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", chrome);

  function inject(src, onerror, onload){
    var s = document.createElement("script");
    s.src = src;
    s.async = false;                            // injected scripts stay in insertion order
    if (onerror) s.onerror = onerror;
    if (onload)  s.onload  = onload;
    document.head.appendChild(s);
  }

  // app.js needs two things that arrive independently: a DOM, because it
  // queries one as it parses, and TEAM_CONFIG, because it reads that as it
  // parses too. A 404 on the team's config is reported asynchronously, so the
  // fallback config can be injected LATER than everything else - which is
  // fine for order (async=false keeps app.js behind it) but means app.js
  // cannot simply go in at DOMContentLoaded. It waits for both.
  var domReady = document.readyState !== "loading", teamReady = false, started = false;
  function start(){
    if (!domReady || !teamReady || started) return;
    started = true;
    inject("suite/nav.js");
    inject("suite/home.js");
    inject("suite/game.js");
    inject("app.js");
  }

  function loadTeam(tid, mayFallBack){
    inject("teams/" + tid + ".js",
      function(){                               // no config under that id
        if (!mayFallBack) return;               // the default itself is missing; stop rather than loop
        set(TEAM_KEY, DEFAULT);
        document.documentElement.setAttribute("data-team", DEFAULT);
        loadTeam(DEFAULT, false);
      },
      function(){ teamReady = true; start(); });
  }

  // The team's config first, because app.js reads TEAM_CONFIG as it parses.
  // A missing one falls back to the default rather than loading an
  // application with no team. This is what replaces a hard-coded list of
  // known teams: the file system is the list (decision 0014).
  if (!choosing) loadTeam(id, id !== DEFAULT);

  // The registry and TeamOS load either way - the chooser needs them too.
  ["teams/index.js", "teamos/registry.js", "teamos/team.js", "teamos/snapshots.js",
   "teamos/identity.js", "teamos/live.js", "teamos/season.js", "teamos/espn.js",
   "teamos/game.js", "teamos/outlook.js", "teamos/freshness.js", "teamos/weather.js",
   "suite/ui.js"]
    .forEach(function(src){ inject(src); });

  if (choosing) {
    // No team, so no Suite. The chooser renders instead, from the registry.
    document.documentElement.setAttribute("data-choosing", "");
    inject("chooser.js");
  } else if (domReady) {
    start();
  } else {
    document.addEventListener("DOMContentLoaded", function(){ domReady = true; start(); });
  }
})();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- The compact SUITE header: the chooser, Home and Game (decision 0023).
     The wordmark is type, not an image, until a bespoke mark exists. -->
<header class="app-bar on-dark" id="appBar">
  <span class="wordmark">Suite</span>
  <!-- The selected team, as context on national screens (Top 25). Not a
       control: Change Team lives in Settings (decision 0024 §6). -->
  <span class="bar-context" id="barContext" hidden>
    <span class="mark bare" id="barMark" aria-hidden="true"></span>
    <span class="bar-team" id="barTeam"></span>
  </span>
  <span class="spacer"></span>
</header>

<!-- The team masthead: Top 25, Schedule, Roster and More. Painted from the
     team's identity by app.js; its art slot falls back to the team's own
     colours until approved art exists. -->
<header class="masthead on-dark" id="masthead" hidden>
  <div class="art-slot" id="mastArt" aria-hidden="true"></div>
  <div class="mast-id">
    <span class="mark bare" id="mastMark" aria-hidden="true"></span>
    <p class="mast-names">
      <span class="mast-name" id="mastName"></span>
      <span class="mast-nick" id="mastNick"></span>
      <span class="mast-tagline" id="mastTagline"></span>
    </p>
    <span class="mast-balance" aria-hidden="true"></span>
  </div>
  <h1 class="mast-title" id="mastTitle" tabindex="-1"></h1>
</header>

<!-- 4.1.3 - one polite region announces every load result -->
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<main class="page-main" id="main" tabindex="-1">
  <!-- The screen's name for assistive technology where no masthead shows it. -->
  <h1 class="sr-only" id="screenHead" tabindex="-1"></h1>

  <!-- Home and Game, rebuilt in the canonical system (suite/home.js, suite/game.js). -->
  <div class="home" id="screenHome" hidden></div>
  <div class="game" id="screenGame" hidden></div>

  <!-- Screens not yet rebuilt in the canonical system (legacy.css). -->
  <div class="legacy on-dark" id="legacy">
    <section class="hero" id="hero" aria-labelledby="heroHead" hidden>
      <h2 class="sr-only" id="heroHead">Next team game</h2>
      <p class="when" id="heroWhen">Next up</p>
      <p class="opp" id="heroOpp"></p>
      <p class="line" id="heroLine"></p>
      <p class="venue" id="heroVenue"></p>
      <p class="series" id="heroSeries" hidden></p>
      <p class="wx" id="heroWx" hidden></p>
      <p class="spread" id="heroSpread"></p>
      <!-- aria-live off: a countdown that announced itself every 30s would be unusable -->
      <p class="clock" id="heroClock" aria-live="off"></p>
    </section>
    <!-- the hero, folded to one line, on screens where the full card is in the way -->
    <button type="button" class="heromini" id="heroMini" hidden></button>

    <div class="strip" id="strip" hidden>
      <button type="button" class="cell" id="btnTitle" aria-expanded="false" aria-controls="oddsboard">
        <span class="k">National title</span>
        <span class="v pending" id="mTitle">Loading…</span>
      </button>
      <button type="button" class="cell" id="btnPlayoff" aria-expanded="false" aria-controls="oddsboard">
        <span class="k">Playoff</span>
        <span class="v pending" id="mPlayoff">Loading…</span>
      </button>
    </div>
    <p class="hint" id="oddsHint" hidden>Tap either card for the full board</p>
    <div id="oddsboard" hidden></div>

    <h2 class="sr-only" id="dataHead">Team and national football data</h2>

    <div id="tabpanel">
      <section id="panel-schedule" aria-label="Season">
        <p class="loading">Loading the schedule…</p>
      </section>
      <section id="panel-around" aria-label="Top 25" hidden></section>
      <section id="panel-game" aria-label="Game" hidden></section>
      <section id="panel-depth" aria-label="Roster" hidden></section>
      <section id="panel-more" aria-label="More" hidden>
        <div class="team-row">
          <p>Following <strong id="moreTeam"></strong></p>
          <button type="button" class="change-team" id="changeTeam">Change team</button>
        </div>
        <div class="team-row">
          <p>Updates on its own, and live during games</p>
          <button type="button" class="refresh" id="refresh"><span class="refresh-icon" aria-hidden="true">↻</span> Refresh</button>
        </div>
        <section id="panel-news" aria-label="News"></section>
      </section>
    </div>

    <footer><p class="foot" id="foot">Loading…</p></footer>
  </div>
</main>

<!-- Primary navigation: five destinations, as links to in-page routes, so
     the browser's Back and deep links work (suite/nav.js). While the team's
     game is live, Game becomes the raised circle with a live light in it. -->
<nav class="navbar" id="navbar" aria-label="Primary">
  <a class="nav-item" href="#home" data-screen="home"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 9.6V20h12.4V9.6"/><path d="M10 20v-5.6h4V20"/></svg><span>Home</span></a>
  <a class="nav-item" href="#top25" data-screen="top25"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="solid" x="3.5" y="13" width="3.2" height="7" rx=".6"/><rect class="solid" x="8.6" y="9" width="3.2" height="11" rx=".6"/><rect class="solid" x="13.7" y="11" width="3.2" height="9" rx=".6"/><rect class="solid" x="18.8" y="5" width="3.2" height="15" rx=".6"/></svg><span>Top 25</span></a>
  <a class="nav-item nav-game" href="#game" data-screen="game"><span class="nav-live"></span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.8" y="6" width="18.4" height="14" rx="2.2"/><path d="M7.2 6V3.3M16.8 6V3.3M12 9v8"/><rect x="5.6" y="9" width="4" height="8" rx="1.4"/><rect x="14.4" y="9" width="4" height="8" rx="1.4"/></svg><span>Game</span><span class="sr-only" id="navLive"></span></a>
  <a class="nav-item" href="#roster" data-screen="roster"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8.3" r="3.3"/><path d="M3.2 19.8c.6-3.4 2.9-5.4 5.8-5.4s5.2 2 5.8 5.4"/><path d="M15.4 5.3a3.1 3.1 0 0 1 0 6M16.9 14.6c2 .5 3.3 2.2 3.8 5.2"/></svg><span>Roster</span></a>
  <a class="nav-item" href="#more" data-screen="more"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="solid" cx="5" cy="12" r="1.9"/><circle class="solid" cx="12" cy="12" r="1.9"/><circle class="solid" cx="19" cy="12" r="1.9"/></svg><span>More</span></a>
</nav>

<!-- The team config, TeamOS and app.js are injected by the boot script in
     the head, which is what decides the team. Nothing is named here. -->
</body>
</html>
