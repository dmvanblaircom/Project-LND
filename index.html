<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irish Watch — Notre Dame football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Grenze+Gotisch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<meta name="description" content="Irish Watch — a Notre Dame football game-day dashboard.">

<meta name="theme-color" content="#0C2340">
<meta name="application-name" content="Irish Watch">

<link rel="manifest" href="assets/notre-dame/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Irish Watch">

<link rel="icon" type="image/svg+xml" href="assets/notre-dame/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/notre-dame/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/notre-dame/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/notre-dame/icon-180.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Irish Watch — Notre Dame Football">
<meta property="og:description" content="Game day. Every day.">
<meta property="og:image" content="assets/notre-dame/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Irish Watch — Notre Dame Football">
<meta name="twitter:description" content="Game day. Every day.">
<meta name="twitter:image" content="assets/notre-dame/og-1200x630.png">
</head>
<body>
<a class="skip" href="#tabpanel">Skip to the season</a>
<div class="page">
<div class="wrap">

  <header class="bar">
    <div class="brand-group">
      <div class="brand-lockup">
        <div class="brand-kicker">NOTRE DAME FOOTBALL</div>
        <h1>Irish Watch</h1>
      </div>
    </div>
    <span class="rank" id="rank" hidden></span>
    <span class="rec" id="rec"></span>
    <span class="spacer"></span>
    <button type="button" class="refresh" id="refresh"><span class="refresh-icon" aria-hidden="true">↻</span> Refresh</button>
  </header>

  <!-- 2026 team motto -->
  <p class="motto" id="motto">Leave No Doubt</p>

  <!-- 4.1.3 — one polite region announces every load result -->
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>

  <main>
    <section class="hero" id="hero" aria-labelledby="heroHead" hidden>
      <h2 class="sr-only" id="heroHead">Next Notre Dame game</h2>
      <p class="when" id="heroWhen">Next up</p>
      <p class="opp" id="heroOpp"></p>
      <p class="line" id="heroLine"></p>
      <p class="venue" id="heroVenue"></p>
      <p class="series" id="heroSeries" hidden></p>
      <p class="wx" id="heroWx" hidden></p>
      <p class="spread" id="heroSpread"></p>
      <!-- aria-live off: a countdown that announced itself every 30s would be unusable -->
      <p class="clock" id="heroClock" aria-live="off"></p>
    </section>
    <!-- the hero, folded to one line, on tabs where the full card is in the way -->
    <button type="button" class="heromini" id="heroMini" hidden></button>

    <div class="strip" id="strip">
      <button type="button" class="cell" id="btnTitle" aria-expanded="false" aria-controls="oddsboard">
        <span class="k">National title</span>
        <span class="v pending" id="mTitle">Loading…</span>
      </button>
      <button type="button" class="cell" id="btnPlayoff" aria-expanded="false" aria-controls="oddsboard">
        <span class="k">Playoff</span>
        <span class="v pending" id="mPlayoff">Loading…</span>
      </button>
    </div>
    <p class="hint" id="oddsHint">Tap either card for the full board</p>
    <div id="oddsboard" hidden></div>

    <h2 class="sr-only" id="dataHead">Notre Dame and national football data</h2>

    <div id="tabpanel" tabindex="-1">
      <div role="tabpanel" id="panel-schedule" aria-labelledby="tab-schedule" tabindex="0">
        <p class="loading">Loading the schedule…</p>
      </div>
      <div role="tabpanel" id="panel-around" aria-labelledby="tab-around" tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-game" aria-labelledby="tab-game" tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-depth"  aria-labelledby="tab-depth"  tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-news"   aria-labelledby="tab-news"   tabindex="0" hidden></div>
    </div>
  </main>

  <footer><p class="foot" id="foot">Loading…</p></footer>
</div>
</div>
<nav class="tabbar" role="tablist" aria-label="Sections">
  <button type="button" role="tab" id="tab-schedule" aria-controls="panel-schedule" aria-selected="true" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></button>
  <button type="button" role="tab" id="tab-around" aria-controls="panel-around" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.5h14"/><path d="M7 17V12h3v5M11 17V8h3v9M15 17V5h3v12"/></svg><span>Top 25</span></button>
  <button type="button" role="tab" id="tab-game" aria-controls="panel-game" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9.5h18M12 9.5v10"/><path d="M6 7h4M14 7h4"/><path d="M5.5 12h4v2.75h-4v2.75h4"/><path d="M14.5 12h4l-2.6 5.5"/></svg><span>Game</span></button>
  <button type="button" role="tab" id="tab-depth" aria-controls="panel-depth" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8" r="2.5"/><path d="M4 19c0-3 1.8-5 4.5-5s4.5 2 4.5 5M15.5 11.5a2.5 2.5 0 1 0 0-5M15 14c2.7 0 4.5 1.8 4.5 5"/></svg><span>Depth</span></button>
  <button type="button" role="tab" id="tab-news" aria-controls="panel-news" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h13v15H6.5A1.5 1.5 0 0 1 5 18Z"/><path d="M8 8h7M8 11.5h7M8 15h4"/></svg><span>News</span></button>
</nav>

<!-- the team this Suite is for, then TeamOS: the Team model and the ESPN adapter app.js consumes -->
<script src="teams/notre-dame.js" defer></script>
<script src="teamos/team.js" defer></script>
<script src="teamos/snapshots.js" defer></script>
<script src="teamos/identity.js" defer></script>
<script src="teamos/live.js" defer></script>
<script src="teamos/espn.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
